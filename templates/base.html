{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link  href="{% static 'css/boot.min.css' %}" rel="stylesheet">
    <title>{% block title %}Home{% endblock title %}</title>
      {% block static_css %}{% endblock static_css %}
</head>
<body>
    {% include "partials/_navbar.html" %}

    {% block content %}
    <img src="{% static 'img/download.png' %}" alt="Image" style="width:100%;height:100%">
    {% endblock content %}


{% block static_js %}{% endblock static_js %}
<script src="{% static 'js/main.js' %}"></script>
<script src="{% static 'js/boot.min.js' %}" ></script>
</body>
</html>
